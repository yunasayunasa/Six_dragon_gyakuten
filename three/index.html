<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#172f2b"><title>Paper HD2D · Engine v1 Acceptance</title></head>
<body><div id="app"></div><header><span class="eyebrow">PAPER HD2D / ENGINE V1 ACCEPTANCE</span><h1>The quiet clearing</h1><p>森の書き割り · 統合確認</p></header>
<nav aria-label="描画設定"><button id="dof">DOF ON</button><button id="quality">LOW</button><button id="audio" aria-pressed="false">音 ON</button><button id="debug" aria-pressed="false">Debug</button><button id="stats-toggle">5分計測</button></nav>
<pre id="stats" aria-live="off"></pre><div id="status" role="status">森を準備しています…</div>
<div id="movement" aria-label="移動"><button data-move="up" aria-label="奥へ">▲</button><button data-move="left" aria-label="左へ">◀</button><button data-move="down" aria-label="手前へ">▼</button><button data-move="right" aria-label="右へ">▶</button></div>
<div id="event-controls"><button id="stage">舞台イベント <span>E</span></button><small>矢印 移動 · D DOF · Q 画質 · M 音 · F4 Debug · F3 Stats · B 計測</small></div>
<div id="loading">PAPER HD2D<span>森の光を準備しています</span></div><script type="module" src="/src/main.js"></script></body></html>
